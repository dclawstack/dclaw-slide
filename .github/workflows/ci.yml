name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude*.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude*.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
        timeout-minutes: 10
